<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="VibeZone">
  <defs>
    <linearGradient id="vz-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Dark purple background -->
  <rect width="512" height="512" fill="#0d0b18" rx="120" />
  
  <!-- Campus tower building -->
  <g transform="translate(130, 160)">
    <path d="M40 140h70v120H40z" fill="#2d1b69" />
    <path d="M40 140L70 90L100 140Z" fill="#3a2a66" />
    <circle cx="70" cy="110" r="10" fill="#ffffff" />
    <path d="M70 116L70 104M56 116L84 116" stroke="#7c5cff" stroke-width="2" stroke-linecap="round" />
  </g>
  
  <!-- Main V mark -->
  <path d="M50 380L180 160L310 380" fill="none" stroke="url(#vz-grad)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Sparkle -->
  <path d="M310 120L300 150L290 130L310 110ZM320 140L330 170L340 140L320 150ZM300 160L310 170L320 160L310 150Z" fill="#ffffff" />
  
  <!-- Vz gradient fill -->
  <path d="M60 380L180 140L300 380" fill="none" stroke="url(#vz-grad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Orbital ring -->
  <path d="M80 340C100 180 320 180 340 340" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.9" />
  
  <!-- Inner glow -->
  <circle cx="200" cy="260" r="80" fill="#7c5cff" opacity="0.25" filter="url(#glow)" />
</svg>