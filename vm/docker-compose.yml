# VibeZone VM stack — OCI Always Free (D5/D8/D12)
# Database is Neon (managed Postgres); the VM only runs mail, realtime, schedulers.
# Run on the VM:   cp .env.example .env  &&  edit secrets  &&  docker compose up -d --build

name: vibezone

services:
  mailer:
    build: ./mailer
    restart: unless-stopped
    environment:
      SMTP_USER: ${SMTP_USER:?set SMTP_USER (vibezoneioi25@gmail.com)}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:?set SMTP_APP_PASSWORD — the 16-char App Password}
      MAILER_SECRET: ${MAILER_SECRET:?set MAILER_SECRET — shared with the Vercel app}
      SMTP_PORT: "587"
    # not published — only reachable through Caddy (TLS) / the scheduler network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  realtime:
    build: ./realtime
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (Neon pooled URL)}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET — same as Vercel}
      REALTIME_SECRET: ${REALTIME_SECRET:?set REALTIME_SECRET — same as Vercel}
      APP_ORIGIN: ${APP_ORIGIN:-}
      PORT: "3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    build: ./scheduler
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (Neon pooled URL)}
      APP_URL: ${APP_URL:-https://vibezone.vercel.app}
      MAILER_URL: http://mailer:3001/send
      MAILER_SECRET: ${MAILER_SECRET:?set MAILER_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:vibezoneioi25@gmail.com}
    depends_on:
      mailer:
        condition: service_started

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?set CADDY_DOMAIN — e.g. <VM_IP>.sslip.io}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mailer
      - realtime

volumes:
  caddy_data:
  caddy_config:
